<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f4a2b"/>
      <stop offset="45%" stop-color="#55341f"/>
      <stop offset="100%" stop-color="#2f1c12"/>
    </linearGradient>
    <pattern id="rings" width="180" height="180" patternUnits="userSpaceOnUse">
      <path d="M-30 90 C 30 30, 150 30, 210 90" stroke="#ffffff" stroke-opacity="0.06" fill="none" stroke-width="4"/>
      <path d="M-20 120 C 40 60, 140 60, 200 120" stroke="#000000" stroke-opacity="0.07" fill="none" stroke-width="3"/>
      <path d="M-40 150 C 20 90, 160 90, 220 150" stroke="#ffffff" stroke-opacity="0.05" fill="none" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" rx="40" fill="url(#wood)"/>
  <rect width="1600" height="1000" rx="40" fill="url(#rings)"/>
